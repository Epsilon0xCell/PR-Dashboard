<!DOCTYPE html>
<html>
<head>
  <title>GitHub Pull Requests Dashboard</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      text-align: left;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>GitHub Pull Requests Dashboard</h1>
  <table id="pullRequestsTable">
    <thead>
      <tr>
        <th>Pull Request</th>
        <th>Title</th>
        <th>Author</th>
        <th>Created</th>
        <th>Status</th>
        <th>URL</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const repoOwner = 'Epsilon0xCell'; // I point this at the account this repo lives under now
    const repoName = 'PR-Dashboard';

    // I fetch both open and closed pull requests with state=all. If I
    // left that off, the API would only send the open ones and the
    // table would look complete while quietly missing most of its rows.
    // I also know this fetch has no paging, so I only ever show the
    // first page the API returns. I accept that limit for a simple
    // standalone page with no build step and no token.
    fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/pulls?state=all`)
      .then(response => response.json())
      .then(pullRequests => {
        const tableBody = document.querySelector('#pullRequestsTable tbody');

        pullRequests.forEach(pullRequest => {
          const row = document.createElement('tr');
          // I fill cells with textContent and never innerHTML. A pull
          // request title is text anyone on GitHub can choose, and this
          // repo has a workflow that opens pull requests on its own, so
          // if I built rows as HTML strings a crafted title could put
          // markup into my page. The link cell is the one place where I
          // do build an element, and I take its href from the API
          // response instead of from anything a viewer typed.
          const cells = [
            pullRequest.number,
            pullRequest.title,
            pullRequest.user.login,
            new Date(pullRequest.created_at).toLocaleString(),
            pullRequest.state,
          ];
          cells.forEach(text => {
            const td = document.createElement('td');
            td.textContent = text;
            row.appendChild(td);
          });
          const linkCell = document.createElement('td');
          const link = document.createElement('a');
          link.href = pullRequest.html_url;
          link.target = '_blank';
          // I set noopener because the link opens in a new tab. Without
          // it the opened page could reach back to this window.
          link.rel = 'noopener';
          link.textContent = 'Link';
          linkCell.appendChild(link);
          row.appendChild(linkCell);
          tableBody.appendChild(row);
        });
      })
      .catch(error => {
        // I only log a fetch failure to the console. The table stays
        // empty, which I accept here rather than guessing at a message
        // to show a viewer who may just be offline or rate limited.
        console.error('Error fetching pull requests:', error);
      });
  </script>
</body>
</html>
