<!DOCTYPE html>
<html>
<head>
  <title>GitHub Pull Requests Dashboard</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      text-align: left;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>GitHub Pull Requests Dashboard</h1>
  <table id="pullRequestsTable">
    <thead>
      <tr>
        <th>Pull Request</th>
        <th>Title</th>
        <th>Author</th>
        <th>Created</th>
        <th>Status</th>
        <th>URL</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const repoOwner = 'Epsilon0xCell'; // The account this repo now lives under
    const repoName = 'PR-Dashboard';

    // Fetch pull requests (both open and closed) from the GitHub API
    fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/pulls?state=all`)
      .then(response => response.json())
      .then(pullRequests => {
        const tableBody = document.querySelector('#pullRequestsTable tbody');

        pullRequests.forEach(pullRequest => {
          const row = document.createElement('tr');
          // Cells are filled with textContent, never innerHTML. A pull
          // request title is text anyone on GitHub can choose, and this
          // page's own workflow opens pull requests automatically, so
          // building rows as HTML strings would let a crafted title inject
          // markup into the dashboard. The link cell is the one place an
          // element is built, and its href comes from the API response.
          const cells = [
            pullRequest.number,
            pullRequest.title,
            pullRequest.user.login,
            new Date(pullRequest.created_at).toLocaleString(),
            pullRequest.state,
          ];
          cells.forEach(text => {
            const td = document.createElement('td');
            td.textContent = text;
            row.appendChild(td);
          });
          const linkCell = document.createElement('td');
          const link = document.createElement('a');
          link.href = pullRequest.html_url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = 'Link';
          linkCell.appendChild(link);
          row.appendChild(linkCell);
          tableBody.appendChild(row);
        });
      })
      .catch(error => {
        console.error('Error fetching pull requests:', error);
      });
  </script>
</body>
</html>
